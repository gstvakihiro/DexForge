name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + build check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar que a aplicação importa sem erros
        # Usamos valores fake só pra satisfazer as variáveis obrigatórias
        # do Settings — não conecta em nada de verdade nesse passo.
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/fake"
          JWT_SECRET: "fake-secret-for-ci"
        run: python -c "import app.main"

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar lint
        run: npm run lint

      - name: Build de produção
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build
